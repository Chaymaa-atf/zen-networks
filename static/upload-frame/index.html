<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Attachment</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="wrapper">
    <input id="fileInput" type="file" />
    <div id="fileName" class="info">Aucun fichier choisi</div>

    <div class="actions">
      <button id="sendBtn" class="primary" type="button">Envoyer</button>
      <button id="cancelBtn" class="secondary" type="button">Annuler</button>
    </div>

    <div id="status" class="info"></div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
