modules:
  jira:globalPage:
    - key: gestion-test-global-page
      title: Gestion Missions
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      resource: main
      render: native
      resolver:
        function: resolver
      route: gestion-test

  function:
    - key: resolver
      handler: index.handler

    - key: attachment-consumer-fn
      handler: consumer.handler

  consumer:
    - key: attachment-analysis-consumer
      queue: attachment-analysis-queue
      function: attachment-consumer-fn

resources:
  - key: main
    path: src/frontend/index.jsx

app:
  id: ari:cloud:ecosystem::app/35bc0dd3-b8f7-40c4-a80d-32754e2ac778
  runtime:
    name: nodejs20.x

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
  external:
    fetch:
      backend:
        - https://api.openai.com